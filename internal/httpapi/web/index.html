<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentHub</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f5;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: #1a1a2e;
        color: white;
        padding: 16px 24px;
        font-size: 18px;
        font-weight: 600;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .message {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .user {
        align-self: flex-end;
        background: #4a6cf7;
        color: white;
        border-bottom-right-radius: 4px;
      }
      .assistant {
        align-self: flex-start;
        background: white;
        color: #1a1a2e;
        border: 1px solid #e0e0e0;
        border-bottom-left-radius: 4px;
      }
      .assistant.error {
        background: #fff0f0;
        border-color: #ffcccc;
        color: #cc0000;
      }
      .typing {
        color: #999;
        font-style: italic;
      }
      #input-area {
        display: flex;
        padding: 16px 24px;
        background: white;
        border-top: 1px solid #e0e0e0;
        gap: 12px;
      }
      #message-input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
      }
      #message-input:focus {
        border-color: #4a6cf7;
      }
      #send-btn {
        padding: 12px 24px;
        background: #4a6cf7;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }
      #send-btn:disabled {
        background: #aaa;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>AgentHub Playground</header>
    <div id="chat"></div>
    <div id="input-area">
      <input
        type="text"
        id="message-input"
        placeholder="输入消息..."
        autocomplete="off"
      />
      <button id="send-btn">发送</button>
    </div>
    <script>
      const chatDiv = document.getElementById("chat");
      const input = document.getElementById("message-input");
      const sendBtn = document.getElementById("send-btn");

      let isGenerating = false; // 防止用户在生成过程中重复发送

      function addMessage(role, text) {
        const div = document.createElement("div");
        div.className = `message ${role}`;
        div.textContent = text;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight; // 自动滚动到底部
        return div; // 返回引用，方便后续追加文本
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text || isGenerating) return;

        isGenerating = true;
        sendBtn.disabled = true;
        input.value = "";

        addMessage("user", text);
        const assistantDiv = addMessage("assistant", "正在输入...");
        let firstChunk = true; // 第一个 chunk 要替换"正在输入..."

        try {
          const response = await fetch("/chat/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });

          if (!response.ok) {
            // HTTP 错误（如 400/502），读取错误信息
            const errData = await response.json();
            throw new Error(errData.error || `HTTP ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const events = buffer.split("\n\n");
            buffer = events.pop();

            for (const raw of events) {
              let eventType = "message",
                data = "";
              for (const line of raw.split("\n")) {
                if (line.startsWith("event: ")) eventType = line.slice(7);
                if (line.startsWith("data: ")) data = line.slice(6);
              }

              if (eventType === "chunk") {
                const chunk = JSON.parse(data);
                if (firstChunk) {
                  assistantDiv.textContent = chunk.content;
                  firstChunk = false;
                } else {
                  assistantDiv.textContent += chunk.content;
                }
                chatDiv.scrollTop = chatDiv.scrollHeight;
              } else if (eventType === "error") {
                const err = JSON.parse(data);
                throw new Error(err.error || "stream error");
              }
              // done 事件不需要特殊处理，流结束后 reader.read() 会返回 done=true
            }
          }
        } catch (err) {
          assistantDiv.className = "message assistant error";
          assistantDiv.textContent = `错误：${err.message}`;
        } finally {
          isGenerating = false;
          sendBtn.disabled = false;
          input.focus();
        }
      }

      sendBtn.addEventListener("click", sendMessage);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      input.focus();
    </script>
  </body>
</html>
