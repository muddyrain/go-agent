<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">R.3.1 请求日志中间件调用顺序</title><desc id="desc">启动时 loggingMiddleware 包装 ServeMux 并返回 Handler。每次请求进入后记录 start，注册延迟日志，调用 next ServeHTTP，把同一请求和响应写入器交给 ServeMux。匹配的业务 Handler 或默认404/405完成后返回，中间件计算耗时并写日志。不修改响应，不恢复panic。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="300" rx="12" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="32" font-size="20" font-weight="600">中间件包在路由外：进入 → 调用 → 返回 → 日志</text><text x="24" y="58" font-size="14" fill="#5b6f7b">R.3.1 教学目标示意 · 只观察请求，不修改响应</text><rect x="26" y="82" width="105" height="80" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="78" y="113" text-anchor="middle" font-size="16">HTTP Server</text><text x="78" y="140" text-anchor="middle" font-size="14">调用外层</text><rect x="173" y="82" width="215" height="80" rx="9" fill="#e5f3ed" stroke="#91b7a3"/><text x="280" y="108" text-anchor="middle" font-size="16">logging Handler</text><text x="280" y="132" text-anchor="middle" font-size="14">start := time.Now()</text><text x="280" y="152" text-anchor="middle" font-size="13">注册 defer，暂不输出日志</text><rect x="443" y="82" width="107" height="80" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="496" y="113" text-anchor="middle" font-size="16">ServeMux</text><text x="496" y="140" text-anchor="middle" font-size="14">匹配路由</text><rect x="589" y="82" width="107" height="80" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="642" y="113" text-anchor="middle" font-size="16">Handler</text><text x="642" y="139" text-anchor="middle" font-size="13">或 404 / 405</text><rect x="173" y="210" width="215" height="54" rx="9" fill="#fff4de" stroke="#c8b17c"/><text x="280" y="232" text-anchor="middle" font-size="15">defer 执行：计算耗时</text><text x="280" y="253" text-anchor="middle" font-size="13">记录 method / path / duration</text><g stroke="#53768b" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M131 123H173"/><path d="M388 123H443"/><path d="M550 123H589"/><path d="M642 162V185H280V210"/></g><text x="415" y="99" text-anchor="middle" font-size="12">next.ServeHTTP</text><text x="529" y="205" text-anchor="middle" font-size="14">下游执行结束，控制流返回</text><text x="24" y="286" font-size="13" fill="#5b6f7b">包装发生在启动时；计时发生在每次请求里。耗时不等于客户端接收完成时间。</text></g></svg>
