<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">C.2 交互式 CLI 调用链</title>
  <desc id="desc">展示终端输入、应用层会话历史、Eino ReAct Agent、模型和工具之间的调用顺序，以及失败时回滚本轮用户消息的路径。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#476582"/>
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b24b4b"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #17212b; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #5a6977; }
      .lane-title { font: 700 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #17212b; }
      .node-title { font: 700 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #17212b; }
      .node-text { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #40505f; }
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #476582; }
      .error-label { font: 600 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #a03f3f; }
      .note { font: 400 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #596875; }
    </style>
  </defs>

  <rect width="1280" height="820" fill="#f7f8f6"/>
  <text x="64" y="58" class="title">C.2 交互式 CLI：单会话多轮调用链</text>
  <text x="64" y="88" class="subtitle">终端负责输入输出，应用层显式维护 history，Eino ReAct Agent 负责模型—工具循环</text>

  <rect x="54" y="122" width="250" height="580" rx="18" fill="#eef5fb" stroke="#b8cee0"/>
  <rect x="326" y="122" width="306" height="580" rx="18" fill="#f2f7f2" stroke="#bfd4c0"/>
  <rect x="654" y="122" width="288" height="580" rx="18" fill="#fff8ed" stroke="#e2c99f"/>
  <rect x="964" y="122" width="262" height="580" rx="18" fill="#f8f1f1" stroke="#d9bcbc"/>

  <text x="179" y="158" text-anchor="middle" class="lane-title">终端 I/O</text>
  <text x="479" y="158" text-anchor="middle" class="lane-title">AgentHub 应用层</text>
  <text x="798" y="158" text-anchor="middle" class="lane-title">Eino ReAct Agent</text>
  <text x="1095" y="158" text-anchor="middle" class="lane-title">模型与工具</text>

  <rect x="83" y="190" width="192" height="76" rx="12" fill="#ffffff" stroke="#8eb4d2"/>
  <text x="179" y="220" text-anchor="middle" class="node-title">读取一行输入</text>
  <text x="179" y="245" text-anchor="middle" class="node-text">空行跳过；exit / quit / EOF 退出</text>

  <rect x="360" y="190" width="238" height="76" rx="12" fill="#ffffff" stroke="#8fbe95"/>
  <text x="479" y="220" text-anchor="middle" class="node-title">追加 UserMessage</text>
  <text x="479" y="245" text-anchor="middle" class="node-text">history = append(history, user)</text>

  <rect x="686" y="190" width="224" height="76" rx="12" fill="#ffffff" stroke="#d7ad6b"/>
  <text x="798" y="220" text-anchor="middle" class="node-title">每轮新建 MessageFuture</text>
  <text x="798" y="245" text-anchor="middle" class="node-text">Stream(ctx, history, options...)</text>

  <rect x="994" y="190" width="202" height="76" rx="12" fill="#ffffff" stroke="#c99494"/>
  <text x="1095" y="220" text-anchor="middle" class="node-title">ChatModel</text>
  <text x="1095" y="245" text-anchor="middle" class="node-text">结合完整历史决定回答或工具调用</text>

  <line x1="275" y1="228" x2="352" y2="228" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="598" y1="228" x2="678" y2="228" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="228" x2="986" y2="228" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="994" y="318" width="202" height="76" rx="12" fill="#ffffff" stroke="#c99494"/>
  <text x="1095" y="348" text-anchor="middle" class="node-title">可选：get_weather</text>
  <text x="1095" y="373" text-anchor="middle" class="node-text">ToolCall → ToolMessage</text>

  <path d="M1095 266 L1095 310" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M994 356 C930 356 930 300 986 300" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="936" y="339" text-anchor="middle" class="label">工具结果回到模型</text>

  <rect x="686" y="440" width="224" height="92" rx="12" fill="#ffffff" stroke="#d7ad6b"/>
  <text x="798" y="470" text-anchor="middle" class="node-title">输出最终回答流</text>
  <text x="798" y="495" text-anchor="middle" class="node-text">Recv() 逐个消费增量 Chunk</text>
  <text x="798" y="516" text-anchor="middle" class="node-text">一次模型流结束后关闭 stream</text>

  <path d="M1095 394 C1095 450 986 486 918 486" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M686 486 L283 486" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="479" y="475" text-anchor="middle" class="label">边接收边打印 assistant 内容</text>

  <rect x="360" y="570" width="238" height="96" rx="12" fill="#ffffff" stroke="#8fbe95"/>
  <text x="479" y="600" text-anchor="middle" class="node-title">收集本轮 Agent 消息</text>
  <text x="479" y="625" text-anchor="middle" class="node-text">合并各消息流的增量分片</text>
  <text x="479" y="647" text-anchor="middle" class="node-text">追加 ToolCall / Tool / Final Answer</text>

  <path d="M798 532 C798 618 686 618 606 618" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M360 618 C300 618 300 278 360 278" fill="none" stroke="#476582" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="450" text-anchor="middle" transform="rotate(-90 310 450)" class="label">下一轮继续使用同一个 history</text>

  <path d="M686 285 C620 285 620 336 562 336" fill="none" stroke="#b24b4b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-error)"/>
  <rect x="360" y="302" width="202" height="68" rx="12" fill="#fff4f3" stroke="#d89c98"/>
  <text x="461" y="330" text-anchor="middle" class="node-title">本轮失败</text>
  <text x="461" y="353" text-anchor="middle" class="node-text">打印错误并回滚 UserMessage</text>
  <path d="M360 336 C300 336 300 228 283 228" fill="none" stroke="#b24b4b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-error)"/>
  <text x="326" y="316" text-anchor="middle" class="error-label">继续会话</text>

  <rect x="64" y="730" width="1152" height="58" rx="12" fill="#ffffff" stroke="#d7ddd8"/>
  <text x="88" y="756" class="note">历史归属：当前 history 只属于本次 CLI 进程中的一个会话；未来多用户服务必须按会话隔离，不能共享同一切片。</text>
  <text x="88" y="777" class="note">边界：终端输入输出属于应用入口；Eino ReAct Agent 不感知终端，只接收消息并执行模型—工具闭环。</text>
</svg>
