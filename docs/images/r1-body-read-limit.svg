<svg xmlns="http://www.w3.org/2000/svg" width="720" height="255" viewBox="0 0 720 255" role="img" aria-labelledby="title desc"><title id="title">R.1 请求体限量读取</title><desc id="desc">原请求体被 MaxBytesReader 包装为限量读取器，重新赋值给 r.Body。io.ReadAll 读取时才检查上限，不超过 4096 字节可正常完成，超过则返回 MaxBytesError，由 Handler 写出 413。包装时不会读取全文，也不会自动返回 413。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="255" rx="12" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="32" font-size="19" font-weight="600">先包装，后读取：限制的是请求体字节数</text><text x="24" y="56" font-size="14" fill="#5b6f7b">R.1 当前实现示意 · 包装时不读取全文，也不自动发送 413</text><g stroke="#53768b" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M172 113H218"/><path d="M451 113H497"/><path d="M595 146V173H356"/><path d="M595 146V218H356"/></g><rect x="24" y="83" width="148" height="63" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="98" y="111" text-anchor="middle" font-size="16">原 r.Body</text><text x="98" y="133" text-anchor="middle" font-size="14">可读取的请求体流</text><rect x="218" y="83" width="233" height="63" rx="9" fill="#e5f3ed" stroke="#91b7a3"/><text x="334" y="109" text-anchor="middle" font-size="16">MaxBytesReader · 4096 字节</text><text x="334" y="133" text-anchor="middle" font-size="14">限量读取器 → 新 r.Body</text><rect x="497" y="83" width="199" height="63" rx="9" fill="#fff4de" stroke="#c8b17c"/><text x="597" y="111" text-anchor="middle" font-size="16">io.ReadAll(r.Body)</text><text x="597" y="133" text-anchor="middle" font-size="14">读取时检查限制</text><text x="340" y="179" text-anchor="end" font-size="14">不超限：读取完整正文 → 正常响应</text><text x="340" y="224" text-anchor="end" font-size="14">超限：MaxBytesError → Handler 返回 413</text></g></svg>
