<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">标准库与 Hertz Handler 职责对照</title><desc id="desc">R.7.1 教学示意：相同 GET /hello?name=Go 请求。标准库 ServeMux 路由到 helloHandler，r.URL.Query 获取参数，ResponseWriter写响应；Hertz Engine 路由到 helloHandler，c.Query获取参数，c.String配置状态和正文。标准库GET模式包含HEAD，Hertz GET不自动包含HEAD；Hertz本课显式开启方法不允许405。业务缺参判断仍由Handler完成。两个Context并非同一对象。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="390" rx="10" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="32" font-size="20" font-weight="600">HTTP 没变，框架提供的操作入口变了</text><text x="24" y="57" font-size="14" fill="#5b6f7b">R.7.1 示意 · 同一请求：GET /hello?name=Go</text><text x="24" y="92" font-size="16" font-weight="600">标准库 · 8090</text><text x="390" y="92" font-size="16" font-weight="600">Hertz · 8091</text><rect x="24" y="108" width="300" height="51" rx="6" fill="#e3eef8" stroke="#91adc3"/><text x="40" y="139" font-size="15">ServeMux：GET /hello</text><rect x="390" y="108" width="306" height="51" rx="6" fill="#e5f3ed" stroke="#91b7a3"/><text x="406" y="139" font-size="15">Engine：h.GET('/hello', handler)</text><path d="M174 159V185" stroke="#53768b" stroke-width="2" marker-end="url(#a)"/><path d="M543 159V185" stroke="#53768b" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="188" width="300" height="83" rx="6" fill="#e3eef8" stroke="#91adc3"/><text x="40" y="213" font-size="14">r.URL.Query().Get('name')</text><text x="40" y="237" font-size="14">w.WriteHeader / fmt.Fprintf(w,...)</text><text x="40" y="259" font-size="13">请求 r 与响应写入口 w 分开</text><rect x="390" y="188" width="306" height="83" rx="6" fill="#e5f3ed" stroke="#91b7a3"/><text x="406" y="213" font-size="14">c.Query('name')</text><text x="406" y="237" font-size="14">c.String(status, format, values...)</text><text x="406" y="259" font-size="13">c 管请求/响应；ctx 管协作上下文</text><text x="360" y="228" text-anchor="middle" font-size="14">对应</text><text x="24" y="302" font-size="15">共同职责：Handler 仍需判断 name 是否为空，决定 400 或 200</text><text x="24" y="329" font-size="14">默认差异：ServeMux GET 包含 HEAD；Hertz GET 不自动包含 HEAD</text><text x="24" y="355" font-size="14">本课 Hertz 显式开启方法不允许 405；不据此声称响应头完全等价</text><text x="24" y="377" font-size="13" fill="#5b6f7b">构造和注册不执行请求；启动后框架匹配路由，才调用 Handler。</text></g></svg>
