<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">R.3.2 panic 恢复与响应边界</title><desc id="desc">同一请求调用链：日志中间件在外，恢复中间件内调用路由Handler。panic会回到延迟恢复函数。响应未开始返回500，响应已开始则中断请求，不追加错误正文。图为当前教学目标，恢复代码尚待实现。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="280" rx="12" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="32" font-size="20" font-weight="600">recover 终止异常传播，不撤回已经开始的响应</text><text x="24" y="57" font-size="14" fill="#5b6f7b">教学目标示意 · 同一请求 goroutine · 普通非流式 Handler</text><rect x="24" y="81" width="140" height="60" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="94" y="108" text-anchor="middle" font-size="16">logging</text><text x="94" y="130" text-anchor="middle" font-size="13">最外层记录耗时</text><rect x="224" y="81" width="186" height="60" rx="9" fill="#e5f3ed" stroke="#91b7a3"/><text x="317" y="108" text-anchor="middle" font-size="16">recovery</text><text x="317" y="130" text-anchor="middle" font-size="13">defer / recover / started</text><rect x="490" y="81" width="206" height="60" rx="9" fill="#fff4de" stroke="#c8b17c"/><text x="593" y="108" text-anchor="middle" font-size="16">mux → Handler</text><text x="593" y="130" text-anchor="middle" font-size="13">执行中发生 panic</text><g fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#a)"><path d="M164 111H224"/><path d="M410 111H490"/><path d="M593 141V168H317V141"/><path d="M280 141V202H260"/><path d="M354 141V224H430"/></g><text x="494" y="160" text-anchor="middle" font-size="13">panic 沿调用栈返回</text><rect x="24" y="187" width="236" height="57" rx="8" fill="#e5f3ed" stroke="#91b7a3"/><text x="142" y="210" text-anchor="middle" font-size="14">响应未开始</text><text x="142" y="233" text-anchor="middle" font-size="15">返回通用 HTTP 500</text><rect x="430" y="187" width="266" height="57" rx="8" fill="#fff4de" stroke="#c8b17c"/><text x="563" y="210" text-anchor="middle" font-size="14">响应已开始</text><text x="563" y="233" text-anchor="middle" font-size="15">ErrAbortHandler → 中断响应</text><text x="24" y="267" font-size="13" fill="#5b6f7b">客户端不接收堆栈；panic 后的业务语句不继续执行；不是处理普通 error 的替代品。</text></g></svg>
