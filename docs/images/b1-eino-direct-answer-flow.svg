<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">B.1 自研直接回答与 Eino Chain 对照</title>
  <desc id="desc">左侧展示自研 Runtime 的消息、模型与 Agent Run，右侧展示 Eino 的 schema Message、BaseChatModel、Chain、Compile 和 Runnable Invoke。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B6777"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #15252E; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #5C6B73; }
      .lane-title { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #15252E; }
      .node-title { font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #15252E; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #455861; }
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #315465; }
      .arrow { stroke: #4B6777; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#F7F6F1"/>
  <text x="60" y="58" class="title">B.1 直接回答：自研 Runtime 与 Eino 的类型流对照</text>
  <text x="60" y="88" class="subtitle">同一个目标：输入一组历史消息，调用模型，得到一条 Assistant 消息</text>

  <rect x="60" y="125" width="500" height="410" rx="18" fill="#EEF4FA" stroke="#B8D0E1"/>
  <text x="88" y="164" class="lane-title">A.1 自研 Runtime</text>
  <text x="88" y="190" class="body">Agent.Run 内部直接推进同步执行</text>

  <rect x="98" y="230" width="190" height="92" rx="12" fill="#FFFFFF" stroke="#9EBBD0"/>
  <text x="118" y="264" class="node-title">[]llm.Message</text>
  <text x="118" y="291" class="body">User 与历史消息</text>

  <rect x="332" y="230" width="190" height="92" rx="12" fill="#FFFFFF" stroke="#9EBBD0"/>
  <text x="352" y="264" class="node-title">llm.Model</text>
  <text x="352" y="291" class="body">Generate(req)</text>

  <path d="M 288 276 L 332 276" class="arrow"/>

  <rect x="215" y="374" width="190" height="92" rx="12" fill="#DDEBF5" stroke="#7FA8C2"/>
  <text x="235" y="408" class="node-title">Agent.Run</text>
  <text x="235" y="435" class="body">直接控制本次执行</text>

  <path d="M 427 322 L 405 374" class="arrow"/>
  <text x="421" y="356" class="label">返回 Response</text>

  <rect x="640" y="125" width="500" height="480" rx="18" fill="#EEF8F6" stroke="#AED5CE"/>
  <text x="668" y="164" class="lane-title">B.1 Eino compose</text>
  <text x="668" y="190" class="body">先定义 Chain，再 Compile 成 Runnable 后执行</text>

  <rect x="678" y="222" width="190" height="98" rx="12" fill="#FFFFFF" stroke="#91BDB5"/>
  <text x="698" y="256" class="node-title">[]*schema.Message</text>
  <text x="698" y="283" class="body">Chain 输入类型 I</text>
  <text x="698" y="305" class="body">一组时间有序消息</text>

  <rect x="912" y="222" width="190" height="98" rx="12" fill="#FFFFFF" stroke="#91BDB5"/>
  <text x="932" y="256" class="node-title">BaseChatModel</text>
  <text x="932" y="283" class="body">Generate / Stream</text>
  <text x="932" y="305" class="body">Chain 中的模型节点</text>

  <path d="M 868 271 L 912 271" class="arrow"/>

  <rect x="678" y="370" width="190" height="94" rx="12" fill="#DEF0EC" stroke="#70A99F"/>
  <text x="698" y="405" class="node-title">Chain[I, O]</text>
  <text x="698" y="432" class="body">可修改的流程定义</text>

  <rect x="912" y="370" width="190" height="94" rx="12" fill="#FFF4DE" stroke="#D2AE67"/>
  <text x="932" y="405" class="node-title">Compile</text>
  <text x="932" y="432" class="body">检查并生成执行计划</text>

  <path d="M 773 320 L 773 370" class="arrow"/>
  <path d="M 868 417 L 912 417" class="arrow"/>

  <rect x="795" y="505" width="190" height="74" rx="12" fill="#DDEBE9" stroke="#659B93"/>
  <text x="815" y="536" class="node-title">Runnable.Invoke</text>
  <text x="815" y="561" class="body">输入 I，返回 O</text>
  <path d="M 1007 464 L 985 505" class="arrow"/>

  <rect x="60" y="570" width="500" height="70" rx="14" fill="#FFF8E9" stroke="#E3C98A"/>
  <text x="84" y="599" class="label">关键差异</text>
  <text x="84" y="624" class="body">自研版由 Agent.Run 直接执行；Eino 把“定义流程”和“执行流程”分开。</text>

  <text x="670" y="636" class="body">O = *schema.Message：整条 Chain 承诺返回一条模型消息</text>
</svg>
