<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">R.5.1 在内存中测试 HTTP Handler</title><desc id="desc">教学目标：go test运行TestHelloHandler，每个用例通过t.Run构造Request与ResponseRecorder，直接调用helloHandler，Handler把状态、响应头、正文写入Recorder。Result与ReadAll取得实际响应，与独立预期比较；相符PASS，不符FAIL。不启动HTTP服务，不经过ServeMux，不使用网络。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="300" rx="12" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="31" font-size="20" font-weight="600">测试不是再写一个接口，而是调用并核对现有接口逻辑</text><text x="24" y="56" font-size="14" fill="#5b6f7b">R.5.1 教学目标示意 · 直接调用 · 不启动8090服务 · 不经过路由和中间件</text><rect x="24" y="80" width="145" height="63" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="96" y="106" text-anchor="middle" font-size="16">用例输入</text><text x="96" y="130" text-anchor="middle" font-size="14">NewRequest</text><rect x="215" y="80" width="155" height="63" rx="9" fill="#e5f3ed" stroke="#91b7a3"/><text x="292" y="106" text-anchor="middle" font-size="16">helloHandler</text><text x="292" y="130" text-anchor="middle" font-size="14">读取r，写入w</text><rect x="416" y="80" width="280" height="63" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="556" y="106" text-anchor="middle" font-size="16">ResponseRecorder</text><text x="556" y="130" text-anchor="middle" font-size="14">在内存中记录状态、头、正文</text><g fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#a)"><path d="M169 112H215"/><path d="M370 112H416"/><path d="M556 143V188H427"/><path d="M168 219H225"/><path d="M427 219H443"/></g><text x="556" y="173" text-anchor="middle" font-size="13">Result + ReadAll → 实际结果</text><rect x="24" y="193" width="144" height="50" rx="8" fill="#fff8e9" stroke="#c8b17c"/><text x="96" y="224" text-anchor="middle" font-size="16">独立预期 want</text><rect x="225" y="193" width="202" height="50" rx="8" fill="#e5f3ed" stroke="#91b7a3"/><text x="326" y="224" text-anchor="middle" font-size="16">实际 got 与 want 比较</text><text x="450" y="211" font-size="15">相符 → PASS</text><text x="450" y="238" font-size="15">不符 → Errorf / Fatalf → FAIL</text><text x="24" y="279" font-size="13" fill="#5b6f7b">go test → TestHelloHandler → t.Run逐个用例；预期不能由实际结果反推，需验证故意错误确实失败。</text></g></svg>
