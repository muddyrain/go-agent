<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">AgentHub 最终产品蓝图与阶段路线</title>
  <desc id="desc">展示 AgentHub 最终产品形态、自研与 Eino 的技术边界，以及 Phase A 到 Phase I 的阶段路线。</desc>
  <style>
    .title{font:700 34px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#15242c}
    .sub{font:400 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#5a6870}
    .section{font:700 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1b3039}
    .h{font:700 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1b3039}
    .p{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526169}
    .small{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#5d6b72}
    .phase{font:700 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173849}
    .phasecopy{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526169}
    .white{font:700 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
  </style>
  <rect width="1600" height="1080" fill="#f6f4ef"/>
  <rect x="40" y="32" width="1520" height="1016" rx="24" fill="#fff" stroke="#d9dedb"/>

  <text x="78" y="88" class="title">AgentHub 最终产品蓝图</text>
  <text x="78" y="120" class="sub">学习阶段手写最小内核以理解原理；生产阶段使用 Eino，专注真正的 Agent 平台能力</text>

  <rect x="78" y="150" width="1444" height="76" rx="15" fill="#315f75"/>
  <text x="800" y="180" text-anchor="middle" class="white">最终用户体验</text>
  <text x="800" y="207" text-anchor="middle" style="font:500 15px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff;">创建 Agent → 绑定模型 / 工具 / MCP / 知识库 → 流式对话 → 查看运行链路 → 保存数据 → Docker 部署</text>

  <text x="78" y="274" class="section">最终系统边界</text>
  <rect x="78" y="294" width="1444" height="326" rx="18" fill="#f5f8f8" stroke="#cbdcdf"/>

  <rect x="112" y="326" width="1376" height="54" rx="11" fill="#e7f1f4" stroke="#9fc1cc"/>
  <text x="800" y="349" text-anchor="middle" class="h">使用入口</text>
  <text x="800" y="370" text-anchor="middle" class="p">CLI 调试 · HTTP API · SSE 流式接口 · 最小 Web Playground</text>

  <polygon points="792,386 808,386 800,400" fill="#315f75"/>

  <rect x="112" y="408" width="1376" height="76" rx="11" fill="#eef4ec" stroke="#b8cfb0"/>
  <text x="800" y="434" text-anchor="middle" class="h">AgentHub 产品与应用层（我们自己实现）</text>
  <text x="800" y="458" text-anchor="middle" class="p">Agent 配置 · 会话消息 · 运行记录 · API 协议 · MCP 配置 · 知识库 · 权限安全 · 控制台</text>
  <text x="800" y="477" text-anchor="middle" class="small">这是项目的长期核心价值，不交给框架替我们定义</text>

  <polygon points="792,490 808,490 800,504" fill="#315f75"/>

  <rect x="112" y="512" width="1376" height="70" rx="11" fill="#eaf3f6" stroke="#96bdc9"/>
  <text x="800" y="539" text-anchor="middle" class="h">Eino 生产 Runtime（Phase B 后采用）</text>
  <text x="800" y="564" text-anchor="middle" class="p">ChatModel · Tool · ReAct Agent · Stream · Callback · Retriever · Graph / Workflow · Multi-Agent 基础</text>

  <text x="126" y="607" class="small">学习内核：Phase A 用现有自研 Runtime 跑通同一链路；Phase B 完成概念对照后冻结，不维护两套生产实现。</text>

  <text x="78" y="672" class="section">从现在到 V1 的阶段路线</text>

  <g>
    <rect x="78" y="698" width="144" height="126" rx="14" fill="#fff1ec" stroke="#dfaa98"/>
    <text x="94" y="726" class="phase">A 看懂内核</text>
    <text x="94" y="750" class="phasecopy">入口跑通</text>
    <text x="94" y="769" class="phasecopy">模型—工具闭环</text>
    <text x="94" y="788" class="phasecopy">调用链复盘</text>
    <text x="94" y="807" class="phasecopy">最小纵向测试</text>

    <line x1="226" y1="761" x2="244" y2="761" stroke="#315f75" stroke-width="3"/>
    <polygon points="244,754 258,761 244,768" fill="#315f75"/>

    <rect x="262" y="698" width="144" height="126" rx="14" fill="#fff7e8" stroke="#d9bb79"/>
    <text x="278" y="726" class="phase">B Eino 对照</text>
    <text x="278" y="750" class="phasecopy">重做相同用例</text>
    <text x="278" y="769" class="phasecopy">概念映射</text>
    <text x="278" y="788" class="phasecopy">架构决策</text>
    <text x="278" y="807" class="phasecopy">切换生产主线</text>

    <line x1="410" y1="761" x2="428" y2="761" stroke="#315f75" stroke-width="3"/>
    <polygon points="428,754 442,761 428,768" fill="#315f75"/>

    <rect x="446" y="698" width="144" height="126" rx="14" fill="#eef6f8" stroke="#9dc5d0"/>
    <text x="462" y="726" class="phase">C 可用 CLI</text>
    <text x="462" y="750" class="phasecopy">真实模型</text>
    <text x="462" y="769" class="phasecopy">多轮与流式</text>
    <text x="462" y="788" class="phasecopy">本地工具</text>
    <text x="462" y="807" class="phasecopy">Memory 可见</text>

    <line x1="594" y1="761" x2="612" y2="761" stroke="#315f75" stroke-width="3"/>
    <polygon points="612,754 626,761 612,768" fill="#315f75"/>

    <rect x="630" y="698" width="144" height="126" rx="14" fill="#eef6f8" stroke="#9dc5d0"/>
    <text x="646" y="726" class="phase">D 工具与 MCP</text>
    <text x="646" y="750" class="phasecopy">真实 Server</text>
    <text x="646" y="769" class="phasecopy">工具发现调用</text>
    <text x="646" y="788" class="phasecopy">多 Server</text>
    <text x="646" y="807" class="phasecopy">超时与诊断</text>

    <line x1="778" y1="761" x2="796" y2="761" stroke="#315f75" stroke-width="3"/>
    <polygon points="796,754 810,761 796,768" fill="#315f75"/>

    <rect x="814" y="698" width="144" height="126" rx="14" fill="#edf5ed" stroke="#abc9aa"/>
    <text x="830" y="726" class="phase">E API 与 Web</text>
    <text x="830" y="750" class="phasecopy">HTTP / SSE</text>
    <text x="830" y="769" class="phasecopy">中间件</text>
    <text x="830" y="788" class="phasecopy">Playground</text>
    <text x="830" y="807" class="phasecopy">OpenAPI</text>

    <line x1="962" y1="761" x2="980" y2="761" stroke="#315f75" stroke-width="3"/>
    <polygon points="980,754 994,761 980,768" fill="#315f75"/>

    <rect x="998" y="698" width="144" height="126" rx="14" fill="#edf5ed" stroke="#abc9aa"/>
    <text x="1014" y="726" class="phase">F 持久化</text>
    <text x="1014" y="750" class="phasecopy">Agent CRUD</text>
    <text x="1014" y="769" class="phasecopy">会话与消息</text>
    <text x="1014" y="788" class="phasecopy">PostgreSQL</text>
    <text x="1014" y="807" class="phasecopy">重启恢复</text>

    <line x1="1146" y1="761" x2="1164" y2="761" stroke="#315f75" stroke-width="3"/>
    <polygon points="1164,754 1178,761 1164,768" fill="#315f75"/>

    <rect x="1182" y="698" width="144" height="126" rx="14" fill="#f1f1f8" stroke="#b8b6d0"/>
    <text x="1198" y="726" class="phase">G 知识 RAG</text>
    <text x="1198" y="750" class="phasecopy">上传与切分</text>
    <text x="1198" y="769" class="phasecopy">向量检索</text>
    <text x="1198" y="788" class="phasecopy">证据引用</text>
    <text x="1198" y="807" class="phasecopy">最小评测集</text>

    <line x1="1330" y1="761" x2="1348" y2="761" stroke="#315f75" stroke-width="3"/>
    <polygon points="1348,754 1362,761 1348,768" fill="#315f75"/>

    <rect x="1366" y="698" width="156" height="126" rx="14" fill="#f1f1f8" stroke="#b8b6d0"/>
    <text x="1382" y="726" class="phase">H 编排协作</text>
    <text x="1382" y="750" class="phasecopy">单 Agent 基线</text>
    <text x="1382" y="769" class="phasecopy">Graph / Workflow</text>
    <text x="1382" y="788" class="phasecopy">Multi-Agent</text>
    <text x="1382" y="807" class="phasecopy">中断与恢复</text>
  </g>

  <line x1="1444" y1="830" x2="1444" y2="848" stroke="#315f75" stroke-width="3"/>
  <polygon points="1436,848 1452,848 1444,862" fill="#315f75"/>

  <rect x="78" y="866" width="1444" height="84" rx="15" fill="#e7f1f4" stroke="#93bdca"/>
  <text x="104" y="896" class="h">Phase I · 生产化与部署</text>
  <text x="104" y="922" class="p">Trace · 指标 · 评测 · 超时/重试/限流 · 安全基线 · Docker Compose · CI · V1 全链路验收</text>
  <rect x="1250" y="885" width="236" height="46" rx="10" fill="#315f75"/>
  <text x="1368" y="914" text-anchor="middle" class="white">V1 可部署 AgentHub</text>

  <rect x="78" y="974" width="1444" height="48" rx="12" fill="#f3eee3" stroke="#d8c7a5"/>
  <text x="800" y="1004" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#654f29;">路线护栏：连续两课无用户可见进展，或同一能力在自研与 Eino 中重复扩展，就暂停复盘并做减法</text>
</svg>
