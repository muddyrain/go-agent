<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-labelledby="title desc"><title id="title">R.4.1 请求取消是协作通知</title><desc id="desc">客户端请求slow后，Handler同时等待模拟工作Timer或请求Context取消。工作正常结束写200；客户端提前断开，net/http取消请求Context，Done通道关闭，Handler选择取消分支并return，不写成功正文。Context不是强制杀死代码。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="290" rx="12" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="31" font-size="20" font-weight="600">Context 发取消通知；Handler 主动停止</text><text x="24" y="56" font-size="14" fill="#5b6f7b">R.4.1 教学目标示意 · 单个慢接口 · 不使用 panic</text><rect x="24" y="83" width="135" height="62" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="91" y="110" text-anchor="middle" font-size="16">客户端</text><text x="91" y="133" text-anchor="middle" font-size="14">GET /slow</text><rect x="217" y="83" width="182" height="62" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="308" y="110" text-anchor="middle" font-size="16">net/http</text><text x="308" y="133" text-anchor="middle" font-size="14">提供请求 Context</text><rect x="465" y="83" width="231" height="62" rx="9" fill="#e5f3ed" stroke="#91b7a3"/><text x="580" y="110" text-anchor="middle" font-size="16">slowHandler · select</text><text x="580" y="133" text-anchor="middle" font-size="14">等待 Timer / ctx.Done()</text><g fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#a)"><path d="M159 114H217"/><path d="M399 114H465"/><path d="M565 145V184H399"/><path d="M615 145V238H399"/><path d="M92 145V185H217"/></g><text x="324" y="205" text-anchor="middle" font-size="14">模拟工作完成 → 写正文 200</text><text x="390" y="222" text-anchor="middle" font-size="14">Done 关闭 → 记录 canceled → return</text><text x="115" y="214" text-anchor="middle" font-size="12">客户端断开</text><text x="115" y="231" text-anchor="middle" font-size="12">服务器取消 Context</text><text x="24" y="274" font-size="13" fill="#5b6f7b">模拟等待5秒；curl最多等1秒只是客户端设置，不会自动给服务端设置1秒deadline。</text></g></svg>
