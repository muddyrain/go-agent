<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">R.6.1 SSE 写入与刷新</title><desc id="desc">教学目标：一次GET请求中生成四个完整事件，格式event和data加空行。每次Fprintf通过recoveryWriter.Write记录响应开始，随后ResponseController.Flush调用recoveryWriter.FlushError再调用底层刷新。首事件立即发，后续每秒一个，done为应用结束标记，Handler返回结束本HTTP响应；客户端取消时停止等待。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="350" rx="12" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="30" font-size="20" font-weight="600">一次 HTTP 响应，多次写入与刷新</text><text x="24" y="55" font-size="14" fill="#5b6f7b">R.6.1 教学目标示意 · 固定事件 · 同一请求 goroutine</text><rect x="24" y="77" width="185" height="82" rx="8" fill="#e5f3ed" stroke="#91b7a3"/><text x="40" y="102" font-size="16">一个完整 SSE 事件</text><text x="40" y="127" font-size="14">event: message</text><text x="40" y="148" font-size="14">data: 第1条消息 + 空行</text><rect x="269" y="77" width="203" height="82" rx="8" fill="#e3eef8" stroke="#91adc3"/><text x="370" y="104" text-anchor="middle" font-size="16">fmt.Fprintf(w,...)</text><text x="370" y="130" text-anchor="middle" font-size="14">recoveryWriter.Write</text><text x="370" y="150" text-anchor="middle" font-size="13">记录 started，写入响应</text><rect x="527" y="77" width="169" height="82" rx="8" fill="#fff8e9" stroke="#c8b17c"/><text x="611" y="104" text-anchor="middle" font-size="16">controller.Flush()</text><text x="611" y="130" text-anchor="middle" font-size="14">包装器 FlushError</text><text x="611" y="150" text-anchor="middle" font-size="13">委托底层刷新缓冲</text><g fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#a)"><path d="M209 116H269"/><path d="M472 116H527"/><path d="M611 159V190H60V214"/><path d="M90 253H674"/></g><text x="40" y="207" font-size="14">客户端在响应尚未结束时，就能读到已刷出的事件（本地直连示例）</text><g font-size="14" text-anchor="middle"><circle cx="90" cy="253" r="5" fill="#438269"/><circle cx="282" cy="253" r="5" fill="#438269"/><circle cx="474" cy="253" r="5" fill="#438269"/><circle cx="666" cy="253" r="5" fill="#438269"/><text x="90" y="238">立即：message 1</text><text x="282" y="238">约1秒：message 2</text><text x="474" y="238">约2秒：message 3</text><text x="644" y="279">约3秒：done</text></g><text x="24" y="309" font-size="14">每个事件都 Write → Flush；随后 Handler 返回，结束本次 HTTP 响应</text><text x="24" y="331" font-size="13" fill="#5b6f7b">取消时停止等待；空行划分事件，不等于网络分包。Flush 不保证代理立即透传或客户端业务已处理。</text></g></svg>
