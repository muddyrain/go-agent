<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">Hertz Next 与中间件返回顺序</title>
<desc id="desc">R.7.3.1 教学示意。先在路由注册前 Use 日志函数。请求经路由匹配选出处理链，日志中间件记录起点并登记延迟日志，Next 在同一调用栈执行后续链，业务函数返回后 Next 返回，日志中间件退出时执行 defer。删除 Next 不等于终止链，会让延迟日志先于业务函数。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#53768b"/></marker></defs>
<rect width="760" height="400" rx="10" fill="#f8fafc"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747">
<text x="24" y="34" font-size="21" font-weight="600">Next 让后续处理发生在中间件返回之前</text>
<text x="24" y="60" font-size="14" fill="#5b6f7b">R.7.3.1 调用顺序示意 · 同步调用，不创建新 goroutine</text>
<rect x="24" y="80" width="712" height="40" rx="5" fill="#e3eef8"/>
<text x="40" y="106" font-size="15">启动登记：h.Use(loggingMiddleware) → 再注册 GET / POST 路由</text>
<rect x="24" y="146" width="340" height="166" rx="6" fill="#e3eef8" stroke="#91adc3"/>
<text x="42" y="174" font-size="16" font-weight="600">日志中间件</text>
<text x="42" y="204" font-size="15">① start := time.Now()</text>
<text x="42" y="229" font-size="15">② defer：先登记日志，不立即执行</text>
<text x="42" y="262" font-size="16">③ c.Next(ctx)</text>
<text x="42" y="294" font-size="15">⑤ 函数退出 → defer 计算耗时并打印</text>
<rect x="430" y="188" width="306" height="94" rx="6" fill="#e5f3ed" stroke="#91b7a3"/>
<text x="448" y="217" font-size="16" font-weight="600">④ 后续链 / 业务 Handler</text>
<text x="448" y="244" font-size="15">处理请求，构造响应，然后返回</text>
<text x="448" y="269" font-size="13" fill="#5b6f7b">此时不代表客户端已经收到响应</text>
<path d="M364 249H423" stroke="#53768b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M582 282V324H194V309" stroke="#53768b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="387" y="342" font-size="13" fill="#5b6f7b">Next 返回，再退出日志中间件</text>
<text x="24" y="371" font-size="14">删 Next ≠ 停止链；本版本可能先打印日志，再由框架执行业务。</text>
<text x="24" y="392" font-size="13" fill="#5b6f7b">仅统计当前处理链；不记录 query / body，不实现 recovery 或鉴权。</text>
</g></svg>
