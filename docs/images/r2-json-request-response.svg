<svg xmlns="http://www.w3.org/2000/svg" width="720" height="285" viewBox="0 0 720 285" role="img" aria-labelledby="title desc"><title id="title">R.2 JSON 请求与响应的转换链</title><desc id="desc">教学目标：POST greet 请求体 JSON 经限量读取形成字节，再经 Unmarshal 存入 greetRequest，校验后构造 greetResponse，经 Marshal 编成 JSON 字节，最后由 ResponseWriter Write 写回。读取、JSON 解析和 HTTP 写出是不同步骤，当前核心代码尚待实现。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="285" rx="12" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="31" font-size="20" font-weight="600">R.2：读取 ≠ 解析 JSON ≠ 写出响应</text><text x="24" y="55" font-size="14" fill="#5b6f7b">教学目标示意 · 新增 POST /greet · 原有接口保持不变</text><g stroke="#53768b" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M204 114H262"/><path d="M438 114H496"/><path d="M598 149V166H114V183"/><path d="M204 215H262"/><path d="M438 215H496"/></g><rect x="24" y="82" width="180" height="67" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="114" y="108" text-anchor="middle" font-size="16">r.Body · 请求体流</text><text x="114" y="134" text-anchor="middle" font-size="14">Content-Type / 4 KiB</text><rect x="262" y="82" width="176" height="67" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="350" y="108" text-anchor="middle" font-size="16">ReadAll → body</text><text x="350" y="134" text-anchor="middle" font-size="14">JSON 字节 []byte</text><rect x="496" y="82" width="200" height="67" rx="9" fill="#e5f3ed" stroke="#91b7a3"/><text x="596" y="108" text-anchor="middle" font-size="16">Unmarshal → req</text><text x="596" y="134" text-anchor="middle" font-size="14">greetRequest · 校验 Name</text><rect x="24" y="183" width="180" height="65" rx="9" fill="#e5f3ed" stroke="#91b7a3"/><text x="114" y="209" text-anchor="middle" font-size="16">构造 response</text><text x="114" y="235" text-anchor="middle" font-size="14">greetResponse</text><rect x="262" y="183" width="176" height="65" rx="9" fill="#fff4de" stroke="#c8b17c"/><text x="350" y="209" text-anchor="middle" font-size="16">Marshal → data</text><text x="350" y="235" text-anchor="middle" font-size="14">JSON 字节 []byte</text><rect x="496" y="183" width="200" height="65" rx="9" fill="#fff4de" stroke="#c8b17c"/><text x="596" y="209" text-anchor="middle" font-size="16">w.Write(data)</text><text x="596" y="235" text-anchor="middle" font-size="14">application/json · HTTP 200</text><text x="24" y="274" font-size="13" fill="#5b6f7b">成功响应为 JSON；失败先返回 400 / 413 / 415 / 500，本节错误正文暂为纯文本。</text></g></svg>
