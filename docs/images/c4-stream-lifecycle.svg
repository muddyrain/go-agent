<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">C.4 流式输出生命周期</title>
  <desc id="desc">展示 Stream 返回后逐块接收，只有 EOF 表示完整成功；发生读取、空块或输出错误时回滚本轮用户消息；流消费者始终负责关闭 StreamReader。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4c6e84"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b34f4f"/></marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;fill:#18232d}
      .sub{font:400 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;fill:#60707d}
      .h{font:700 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;fill:#1c2933}
      .p{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;fill:#40515f}
      .small{font:400 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;fill:#566773}
      .label{font:600 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;fill:#4c6e84}
      .bad{font:600 13px -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;fill:#a74646}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#f7f8f6"/>
  <text x="62" y="54" class="title">C.4：流式回答的成功边界与职责</text>
  <text x="62" y="83" class="sub">Chunk 表示进度，io.EOF 才表示完整成功；消费者关闭流，会话层维护历史一致性</text>

  <rect x="56" y="122" width="214" height="104" rx="14" fill="#eef5fa" stroke="#9fbdcf"/>
  <text x="163" y="155" text-anchor="middle" class="h">reactAgent.Stream()</text>
  <text x="163" y="183" text-anchor="middle" class="p">返回 StreamReader</text>
  <text x="163" y="207" text-anchor="middle" class="small">此时回答尚未完成</text>

  <rect x="334" y="122" width="248" height="104" rx="14" fill="#eef7f1" stroke="#9bbda1"/>
  <text x="458" y="155" text-anchor="middle" class="h">writeAssistantStream()</text>
  <text x="458" y="183" text-anchor="middle" class="p">唯一 Recv 消费者</text>
  <text x="458" y="207" text-anchor="middle" class="small">defer stream.Close()</text>
  <line x1="270" y1="174" x2="326" y2="174" stroke="#4c6e84" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="646" y="122" width="204" height="104" rx="14" fill="#fff8eb" stroke="#d2b373"/>
  <text x="748" y="155" text-anchor="middle" class="h">Recv() → Chunk</text>
  <text x="748" y="183" text-anchor="middle" class="p">写入 io.Writer</text>
  <text x="748" y="207" text-anchor="middle" class="small">chunks++ 后继续 Recv</text>
  <line x1="582" y1="174" x2="638" y2="174" stroke="#4c6e84" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M850 151 C917 112 947 112 1014 151" fill="none" stroke="#4c6e84" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1014 198 C947 237 917 237 850 198" fill="none" stroke="#4c6e84" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="932" y="105" text-anchor="middle" class="label">还有数据</text>
  <rect x="1018" y="122" width="204" height="104" rx="14" fill="#fff" stroke="#bcc8cf"/>
  <text x="1120" y="155" text-anchor="middle" class="h">下一个 Recv()</text>
  <text x="1120" y="183" text-anchor="middle" class="p">继续等待生产端</text>
  <text x="1120" y="207" text-anchor="middle" class="small">收到 Chunk 仍非结束</text>

  <rect x="98" y="330" width="496" height="192" rx="17" fill="#eff8f1" stroke="#8fb899"/>
  <text x="346" y="366" text-anchor="middle" class="h">成功路径：Recv() 返回 io.EOF</text>
  <text x="130" y="401" class="p">1. 生产端明确表示不会再发送 Chunk</text>
  <text x="130" y="431" class="p">2. writeAssistantStream 返回 chunks, nil</text>
  <text x="130" y="461" class="p">3. defer 关闭 StreamReader</text>
  <text x="130" y="491" class="p">4. run 收集 MessageFuture 并追加完整消息历史</text>

  <rect x="686" y="330" width="496" height="192" rx="17" fill="#fff2f1" stroke="#d09a96"/>
  <text x="934" y="366" text-anchor="middle" class="h">失败路径：读取 / nil Chunk / 输出错误</text>
  <text x="718" y="401" class="p">1. 返回已接收 Chunk 数和包装后的 error</text>
  <text x="718" y="431" class="p">2. defer 同样关闭 StreamReader</text>
  <text x="718" y="461" class="p">3. 已写到终端的部分文本无法撤回</text>
  <text x="718" y="491" class="p">4. run 回滚本轮 UserMessage，不记录残缺回答</text>

  <path d="M748 226 C650 273 503 281 410 322" fill="none" stroke="#4c6e84" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="551" y="276" class="label">io.EOF</text>
  <path d="M748 226 C821 271 875 284 914 322" fill="none" stroke="#b34f4f" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-red)"/>
  <text x="848" y="276" class="bad">其他异常</text>

  <rect x="104" y="594" width="1072" height="108" rx="16" fill="#ffffff" stroke="#c5cfd5"/>
  <line x1="640" y1="612" x2="640" y2="683" stroke="#d5dde1"/>
  <text x="352" y="628" text-anchor="middle" class="h">流级职责</text>
  <text x="352" y="657" text-anchor="middle" class="p">writeAssistantStream：Recv、输出、计数、Close</text>
  <text x="352" y="682" text-anchor="middle" class="small">只知道单个回答流，不知道会话历史</text>
  <text x="914" y="628" text-anchor="middle" class="h">会话级职责</text>
  <text x="914" y="657" text-anchor="middle" class="p">run：用户输入、Agent 调用、历史提交或回滚</text>
  <text x="914" y="682" text-anchor="middle" class="small">掌握本轮 UserMessage 和整个终端会话</text>
</svg>
