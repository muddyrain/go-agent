<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">AgentHub D.2 stdio MCP 调用链</title>
  <desc id="desc">展示 AgentHub 启动 MCP Server 子进程、初始化 Session、发现工具、适配为 Eino Tool、加入 Catalog，并由 ReAct Agent 发起远程调用的两阶段链路。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#39779A"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3E7A59"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #1A1B1C; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #5F6872; }
      .lane { font: 700 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #25313A; }
      .node-title { font: 700 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #1A1B1C; }
      .node-text { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #4F5963; }
      .edge-text { font: 600 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #39779A; }
      .note { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #5F6872; }
    </style>
  </defs>

  <rect width="1440" height="820" fill="#F7F6F1"/>
  <text x="70" y="65" class="title">D.2 单 MCP Server 真实连接</text>
  <text x="70" y="96" class="subtitle">两阶段：启动时建立 Session 并发现工具；运行时由 Eino ReAct Agent 通过同一 Session 远程调用</text>

  <rect x="55" y="130" width="1330" height="285" rx="18" fill="#FFFFFF" stroke="#DDE3E6"/>
  <rect x="55" y="130" width="210" height="285" rx="18" fill="#EAF6FB"/>
  <path d="M247 130 H265 V415 H247 Z" fill="#EAF6FB"/>
  <text x="82" y="181" class="lane">① 启动与发现</text>
  <text x="82" y="211" class="node-text">应用启动时执行一次</text>
  <text x="82" y="235" class="node-text">失败则不进入 CLI</text>

  <rect x="300" y="175" width="190" height="120" rx="14" fill="#F3F8FA" stroke="#B8D7E4"/>
  <text x="325" y="213" class="node-title">cmd/agenthub</text>
  <text x="325" y="242" class="node-text">os.Executable()</text>
  <text x="325" y="266" class="node-text">选择 mcp-server 模式</text>

  <rect x="550" y="175" width="210" height="120" rx="14" fill="#F3FBF5" stroke="#B7D9C4"/>
  <text x="575" y="213" class="node-title">MCP Session</text>
  <text x="575" y="242" class="node-text">启动 stdio 子进程</text>
  <text x="575" y="266" class="node-text">Initialize 协议握手</text>

  <rect x="820" y="175" width="210" height="120" rx="14" fill="#FFF9EE" stroke="#DEC792"/>
  <text x="845" y="213" class="node-title">MCP Server</text>
  <text x="845" y="242" class="node-text">独立 OS 子进程</text>
  <text x="845" y="266" class="node-text">提供 add_numbers</text>

  <rect x="1090" y="175" width="230" height="120" rx="14" fill="#F4F7FD" stroke="#BFCDEB"/>
  <text x="1115" y="213" class="node-title">Eino MCP Adapter</text>
  <text x="1115" y="242" class="node-text">tools/list</text>
  <text x="1115" y="266" class="node-text">转换为 tool.BaseTool</text>

  <line x1="490" y1="235" x2="540" y2="235" stroke="#39779A" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="497" y="220" class="edge-text">启动</text>
  <line x1="760" y1="220" x2="810" y2="220" stroke="#39779A" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="810" y1="252" x2="770" y2="252" stroke="#39779A" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="774" y="204" class="edge-text">stdio JSON-RPC</text>
  <line x1="1030" y1="235" x2="1080" y2="235" stroke="#39779A" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="1037" y="220" class="edge-text">发现</text>

  <rect x="550" y="325" width="770" height="55" rx="12" fill="#F7FAFC" stroke="#D9E2E7"/>
  <text x="575" y="359" class="note">发现结果以 SourceMCP 加入 Tool Catalog；Catalog 只管理与筛选，不建立连接，也不执行 ToolCall。</text>

  <rect x="55" y="450" width="1330" height="285" rx="18" fill="#FFFFFF" stroke="#DDE3E6"/>
  <rect x="55" y="450" width="210" height="285" rx="18" fill="#EEF8F1"/>
  <path d="M247 450 H265 V735 H247 Z" fill="#EEF8F1"/>
  <text x="82" y="501" class="lane">② 运行时调用</text>
  <text x="82" y="531" class="node-text">每次模型选择工具时</text>
  <text x="82" y="555" class="node-text">复用已建立的 Session</text>

  <rect x="300" y="500" width="190" height="120" rx="14" fill="#F3F8FA" stroke="#B8D7E4"/>
  <text x="325" y="538" class="node-title">ReAct Agent</text>
  <text x="325" y="567" class="node-text">模型生成 ToolCall</text>
  <text x="325" y="591" class="node-text">ToolsNode 执行工具</text>

  <rect x="550" y="500" width="210" height="120" rx="14" fill="#F4F7FD" stroke="#BFCDEB"/>
  <text x="575" y="538" class="node-title">适配后的 Eino Tool</text>
  <text x="575" y="567" class="node-text">接收 JSON 参数</text>
  <text x="575" y="591" class="node-text">调用 MCP Client</text>

  <rect x="820" y="500" width="210" height="120" rx="14" fill="#F3FBF5" stroke="#B7D9C4"/>
  <text x="845" y="538" class="node-title">MCP Session</text>
  <text x="845" y="567" class="node-text">发送 tools/call</text>
  <text x="845" y="591" class="node-text">接收 CallToolResult</text>

  <rect x="1090" y="500" width="230" height="120" rx="14" fill="#FFF9EE" stroke="#DEC792"/>
  <text x="1115" y="538" class="node-title">add_numbers Handler</text>
  <text x="1115" y="567" class="node-text">校验 a、b</text>
  <text x="1115" y="591" class="node-text">返回文本结果</text>

  <line x1="490" y1="560" x2="540" y2="560" stroke="#3E7A59" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="760" y1="560" x2="810" y2="560" stroke="#3E7A59" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="1030" y1="545" x2="1080" y2="545" stroke="#3E7A59" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="1080" y1="580" x2="1040" y2="580" stroke="#3E7A59" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1038" y="529" class="edge-text">stdio JSON-RPC</text>

  <rect x="300" y="655" width="1020" height="45" rx="10" fill="#FFF8E8" stroke="#E4CF9F"/>
  <text x="325" y="683" class="note">安全边界：子进程不继承模型密钥环境；stdout 只承载 MCP 协议；CLI 退出时 Session.Close() 结束子进程。</text>

  <text x="70" y="782" class="subtitle">图示基于 D.2 当前实现；多 Server、命名空间、重连与状态管理留到后续课程。</text>
</svg>
