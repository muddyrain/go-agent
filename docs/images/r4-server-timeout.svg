<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" role="img" aria-labelledby="title desc"><title id="title">R.4.2 服务端处理超时与客户端取消</title><desc id="desc">教学目标：请求父Context派生2秒子Context并传给slowHandler。客户端先断开使父与子取消，Handler停止不写错误响应。子Context2秒到期而客户端仍等待，Handler主动返回503。旧slow不派生2秒预算，5秒工作完成返回200。派生超时不自动生成HTTP响应。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="356" rx="12" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="32" font-size="20" font-weight="600">父 Context 管请求，子 Context 加处理预算</text><text x="24" y="57" font-size="14" fill="#5b6f7b">R.4.2 教学目标示意 · /slow/timeout · 保留 /slow 对照</text><rect x="24" y="80" width="190" height="65" rx="9" fill="#e3eef8" stroke="#91adc3"/><text x="119" y="106" text-anchor="middle" font-size="16">r.Context() · 父</text><text x="119" y="130" text-anchor="middle" font-size="14">客户端断开时取消</text><rect x="269" y="80" width="205" height="65" rx="9" fill="#fff8e9" stroke="#c8b17c"/><text x="371" y="106" text-anchor="middle" font-size="16">WithTimeout · 子</text><text x="371" y="130" text-anchor="middle" font-size="14">额外增加2秒处理预算</text><rect x="527" y="80" width="169" height="65" rx="9" fill="#e5f3ed" stroke="#91b7a3"/><text x="611" y="106" text-anchor="middle" font-size="16">slowHandler</text><text x="611" y="130" text-anchor="middle" font-size="14">监听子ctx / 工作Timer</text><g fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#arrow)"><path d="M214 112H269"/><path d="M474 112H527"/><path d="M611 145V167H371"/><path d="M371 167V188"/></g><text x="240" y="101" text-anchor="middle" font-size="12">派生</text><text x="500" y="159" text-anchor="middle" font-size="12">通过 r.WithContext(ctx) 传递</text><rect x="24" y="192" width="672" height="42" rx="7" fill="#fff8e9"/><text x="40" y="218" font-size="15">客户端先断开 → 父取消 → 子取消 → Err = Canceled → return</text><rect x="24" y="242" width="672" height="42" rx="7" fill="#e3eef8"/><text x="40" y="268" font-size="15">服务端预算先到期 → 子取消 → Err = DeadlineExceeded → 写503</text><text x="24" y="313" font-size="14">旧 /slow：无2秒预算；5秒工作完成且请求未取消 → 写200</text><text x="24" y="338" font-size="13" fill="#5b6f7b">Context 只通知；HTTP 响应由 Handler 写。子取消不反向取消父；父时限更早时仍以更早者为限。</text></g></svg>
