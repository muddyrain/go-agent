<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">浏览器 EventSource 与两次 HTTP 请求</title><desc id="desc">R.6.2 教学方案示意：浏览器先请求 /events/demo，eventsPageHandler 返回 HTML。页面里的 JavaScript 创建 EventSource('/events') 发起另一个请求；原 eventsHandler 逐次写入刷新。浏览器按事件名分发，message追加文本，done显示完成并调用close。停止按钮或error也关闭，当前有限流不自动重试；服务端取消或自然返回结束自己的响应。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="390" rx="10" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="31" font-size="20" font-weight="600">加载页面，再单独请求事件流</text><text x="24" y="54" font-size="14" fill="#5b6f7b">R.6.2 方案示意 · 两个请求 · 两个 Handler</text><rect x="24" y="76" width="256" height="72" rx="7" fill="#e5f3ed" stroke="#91b7a3"/><text x="40" y="101" font-size="16">① 浏览器 GET /events/demo</text><text x="40" y="127" font-size="14">页面加载后执行 JavaScript</text><rect x="430" y="76" width="266" height="72" rx="7" fill="#e3eef8" stroke="#91adc3"/><text x="448" y="101" font-size="16">eventsPageHandler</text><text x="448" y="127" font-size="14">返回 HTML，不发送 SSE</text><path d="M280 94H430" fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#arrow)"/><path d="M430 132H280" fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="119" text-anchor="middle" font-size="13">HTML 响应</text><path d="M152 148V183" fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="186" width="256" height="80" rx="7" fill="#e5f3ed" stroke="#91b7a3"/><text x="40" y="212" font-size="16">② EventSource('/events')</text><text x="40" y="237" font-size="14">解析 SSE，按事件名调用回调</text><rect x="430" y="186" width="266" height="80" rx="7" fill="#e3eef8" stroke="#91adc3"/><text x="448" y="212" font-size="16">eventsHandler（原实现）</text><text x="448" y="237" font-size="14">每次 Write → Flush</text><path d="M280 202H430" fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#arrow)"/><path d="M430 254H280" fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="236" text-anchor="middle" font-size="13">message / done</text><path d="M152 266V296" fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="318" font-size="15">message → 追加 data 文本；done → 显示完成并 source.close()</text><text x="24" y="345" font-size="14">停止按钮 / error → close；本节有限流主动停止，不自动重试</text><text x="24" y="372" font-size="13" fill="#5b6f7b">done 不是 HTTP 关闭指令；不调用 close 时，流正常结束后 EventSource 通常会重连。</text></g></svg>
