<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="title desc"><title id="title">Hertz JSON 请求响应对照</title><desc id="desc">R.7.2方案示意：POST /greet，请求JSON name，检查Content-Type415，Body已经接收后的4KiB检查413，标准库Unmarshal400，TrimSpace空name400，响应结构体交给c.JSON编码并构造成功200响应。错误为纯文本，成功为JSON。len检查不是读取过程限内存。c.JSON不接收已经Marshal的字节，不等于自动500。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="370" rx="10" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="31" font-size="20" font-weight="600">解析逻辑保留，响应编码交给 Hertz</text><text x="24" y="56" font-size="14" fill="#5b6f7b">R.7.2 方案示意 · POST /greet · 成功 JSON，错误纯文本</text><rect x="24" y="78" width="302" height="58" rx="6" fill="#e3eef8" stroke="#91adc3"/><text x="40" y="101" font-size="15">c.GetHeader → 检查 Content-Type</text><text x="40" y="123" font-size="13">不是 application/json → 415</text><path d="M175 136V157" stroke="#53768b" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="160" width="302" height="58" rx="6" fill="#e3eef8" stroke="#91adc3"/><text x="40" y="183" font-size="15">c.Request.Body() → 已接收的字节</text><text x="40" y="205" font-size="13">len(body) 超过 4096 → 413</text><path d="M175 218V239" stroke="#53768b" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="242" width="302" height="58" rx="6" fill="#e5f3ed" stroke="#91b7a3"/><text x="40" y="265" font-size="15">json.Unmarshal → TrimSpace 检查</text><text x="40" y="287" font-size="13">解析失败或空 name → 400</text><path d="M326 271H384" stroke="#53768b" stroke-width="2" marker-end="url(#a)"/><rect x="388" y="184" width="308" height="116" rx="6" fill="#fff8e9" stroke="#c8b17c"/><text x="406" y="211" font-size="16">greetResponse（Go 结构体）</text><text x="406" y="239" font-size="15">c.JSON(200, response)</text><text x="406" y="266" font-size="14">框架编码 + JSON 头 + 响应正文</text><text x="406" y="289" font-size="13">结果恰含 message / name 两个键</text><text x="24" y="327" font-size="14">len 检查在接收后；不是 MaxBytesReader 的读取过程限制。</text><text x="24" y="351" font-size="13" fill="#5b6f7b">c.JSON 没有 error 返回；传 Go 数据，不重复传入 Marshal 后的 []byte。</text></g></svg>
