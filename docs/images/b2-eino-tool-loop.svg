<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">B.2 Eino 工具闭环调用链</title>
  <desc id="desc">展示 Eino ReAct Agent 如何把工具说明交给模型，并通过 ToolsNode 执行工具后再次调用模型。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#496A85"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #17212B; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #52606D; }
      .lane { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #25313C; }
      .node-title { font: 700 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #17212B; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #394B59; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #52606D; }
      .step { font: 700 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; fill: #FFFFFF; }
      .line { stroke: #496A85; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6B879D; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#F7F6F1"/>
  <text x="70" y="64" class="title">B.2 Eino 工具闭环：说明给模型，实现给 ToolsNode</text>
  <text x="70" y="96" class="subtitle">固定教学用例：杭州天气；实线表示运行消息流，虚线表示创建阶段的工具绑定</text>

  <rect x="55" y="130" width="1290" height="170" rx="18" fill="#EDF5FB" stroke="#B6D2E5"/>
  <text x="80" y="162" class="lane">创建阶段：react.NewAgent 组装执行图，还没有调用模型</text>

  <rect x="90" y="190" width="250" height="78" rx="12" fill="#FFFFFF" stroke="#B8C8D4"/>
  <text x="110" y="220" class="node-title">weatherTool</text>
  <text x="110" y="245" class="body">Info() + InvokableRun()</text>

  <rect x="505" y="180" width="280" height="98" rx="12" fill="#FFFFFF" stroke="#91B8D4"/>
  <text x="525" y="211" class="node-title">react.NewAgent</text>
  <text x="525" y="237" class="body">读取 ToolInfo，创建 ToolsNode</text>
  <text x="525" y="259" class="body">建立 Model ↔ Tool 循环</text>

  <rect x="950" y="176" width="300" height="48" rx="12" fill="#FFFFFF" stroke="#B8C8D4"/>
  <text x="972" y="206" class="node-title">Model.WithTools(ToolInfo)</text>
  <rect x="950" y="236" width="300" height="48" rx="12" fill="#FFFFFF" stroke="#B8C8D4"/>
  <text x="972" y="266" class="node-title">ToolsNode 保存 Tool 实现</text>

  <path d="M340 218 H505" class="dash"/>
  <path d="M785 209 H950" class="dash"/>
  <path d="M785 249 H950" class="dash"/>
  <text x="370" y="204" class="small">同一个 Tool</text>
  <text x="815" y="194" class="small">说明：供模型决策</text>
  <text x="815" y="273" class="small">实现：供节点执行</text>

  <rect x="55" y="330" width="1290" height="420" rx="18" fill="#FFFFFF" stroke="#D8D7D1"/>
  <text x="80" y="365" class="lane">运行阶段：reactAgent.Generate 完成完整循环</text>

  <circle cx="105" cy="428" r="18" fill="#4C86A8"/>
  <text x="101" y="433" class="step">1</text>
  <rect x="145" y="394" width="230" height="70" rx="12" fill="#F2F8FC" stroke="#A9C9DD"/>
  <text x="165" y="423" class="node-title">User Message</text>
  <text x="165" y="447" class="body">杭州今天天气怎么样？</text>

  <circle cx="455" cy="428" r="18" fill="#4C86A8"/>
  <text x="451" y="433" class="step">2</text>
  <rect x="495" y="386" width="250" height="86" rx="12" fill="#EAF3FC" stroke="#91B8D4"/>
  <text x="515" y="416" class="node-title">Model · 第一次调用</text>
  <text x="515" y="441" class="body">依据 ToolInfo 返回 ToolCall</text>
  <text x="515" y="461" class="small">steps + 1</text>

  <circle cx="825" cy="428" r="18" fill="#4C86A8"/>
  <text x="821" y="433" class="step">3</text>
  <rect x="865" y="382" width="270" height="94" rx="12" fill="#EEF7F2" stroke="#A9CEB7"/>
  <text x="885" y="412" class="node-title">ToolsNode</text>
  <text x="885" y="437" class="body">按 get_weather 定位工具</text>
  <text x="885" y="458" class="body">解码参数并执行 Handler</text>

  <path d="M375 429 H437" class="line"/>
  <path d="M745 429 H807" class="line"/>

  <circle cx="825" cy="604" r="18" fill="#4C86A8"/>
  <text x="821" y="609" class="step">4</text>
  <rect x="865" y="563" width="270" height="84" rx="12" fill="#FFF8E8" stroke="#DFC984"/>
  <text x="885" y="593" class="node-title">ToolMessage</text>
  <text x="885" y="618" class="body">Call ID 关联执行结果</text>
  <text x="885" y="638" class="small">杭州今天晴，25°C。</text>

  <circle cx="455" cy="604" r="18" fill="#4C86A8"/>
  <text x="451" y="609" class="step">5</text>
  <rect x="495" y="559" width="250" height="92" rx="12" fill="#EAF3FC" stroke="#91B8D4"/>
  <text x="515" y="589" class="node-title">Model · 第二次调用</text>
  <text x="515" y="614" class="body">读取 ToolMessage 生成回答</text>
  <text x="515" y="636" class="small">steps + 1</text>

  <circle cx="105" cy="604" r="18" fill="#4C86A8"/>
  <text x="101" y="609" class="step">6</text>
  <rect x="145" y="559" width="230" height="92" rx="12" fill="#F2F8FC" stroke="#A9C9DD"/>
  <text x="165" y="589" class="node-title">Final Assistant</text>
  <text x="165" y="614" class="body">返回最终自然语言答案</text>
  <text x="165" y="636" class="small">无 ToolCall，循环结束</text>

  <path d="M1000 476 V545 Q1000 563 982 563" class="line"/>
  <path d="M865 605 H763" class="line"/>
  <path d="M495 605 H393" class="line"/>

  <rect x="180" y="684" width="1040" height="42" rx="10" fill="#F1F0EB"/>
  <text x="700" y="710" text-anchor="middle" class="body">WithMessageFuture 只旁路观察 Assistant / Tool 消息，不参与路由、执行或 Step 计算</text>
</svg>
