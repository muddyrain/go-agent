<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-labelledby="title desc"><title id="title">R.5.2 共用路由构造并验证分发</title><desc id="desc">教学目标：main和TestRoutes分别调用newMux，使用同一份路由注册。测试通过NewRequest及Recorder在内存中调用mux.ServeHTTP；匹配方法与路径则进入Handler产生200或400，路径存在但方法不允许产生405和Allow，不匹配路径产生404。测试不启动网络或中间件。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53768b"/></marker></defs><rect width="720" height="354" rx="12" fill="#f8fafc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#203747"><text x="24" y="31" font-size="20" font-weight="600">同一份路由注册，两个真实调用方</text><text x="24" y="56" font-size="14" fill="#5b6f7b">R.5.2 教学目标示意 · 测试在内存中执行 · 不占用8090</text><rect x="24" y="77" width="145" height="55" rx="8" fill="#e3eef8" stroke="#91adc3"/><text x="96" y="101" text-anchor="middle" font-size="16">main()</text><text x="96" y="122" text-anchor="middle" font-size="13">启动调用方</text><rect x="24" y="153" width="145" height="55" rx="8" fill="#e3eef8" stroke="#91adc3"/><text x="96" y="177" text-anchor="middle" font-size="16">TestRoutes</text><text x="96" y="198" text-anchor="middle" font-size="13">测试调用方</text><rect x="229" y="109" width="190" height="70" rx="8" fill="#e5f3ed" stroke="#91b7a3"/><text x="324" y="137" text-anchor="middle" font-size="17">newMux()</text><text x="324" y="163" text-anchor="middle" font-size="14">共用全部路由注册代码</text><rect x="488" y="110" width="208" height="70" rx="8" fill="#e3eef8" stroke="#91adc3"/><text x="592" y="137" text-anchor="middle" font-size="16">mux.ServeHTTP(w,r)</text><text x="592" y="163" text-anchor="middle" font-size="14">按方法和路径分发</text><g fill="none" stroke="#53768b" stroke-width="2" marker-end="url(#a)"><path d="M169 104H194V132H229"/><path d="M169 180H194V155H229"/><path d="M419 145H488"/><path d="M592 180V204H325V226"/></g><text x="454" y="137" text-anchor="middle" font-size="12">测试入口</text><rect x="24" y="232" width="214" height="67" rx="8" fill="#edf7f1"/><text x="131" y="258" text-anchor="middle" font-size="16">方法与路径匹配</text><text x="131" y="281" text-anchor="middle" font-size="14">Handler 返回200 / 400</text><rect x="253" y="232" width="214" height="67" rx="8" fill="#fff8e9"/><text x="360" y="258" text-anchor="middle" font-size="16">路径存在，方法不允许</text><text x="360" y="281" text-anchor="middle" font-size="14">ServeMux 返回405 + Allow</text><rect x="482" y="232" width="214" height="67" rx="8" fill="#edf5fb"/><text x="589" y="258" text-anchor="middle" font-size="16">没有匹配路径</text><text x="589" y="281" text-anchor="middle" font-size="14">ServeMux 返回404</text><text x="24" y="328" font-size="13" fill="#5b6f7b">newMux每次创建独立路由器；测试不经过main的监听与中间件。Recorder仍记录状态、响应头、正文。</text></g></svg>
